      <stop offset="0" stop-color="#050714"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
