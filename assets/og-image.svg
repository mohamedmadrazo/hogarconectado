  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <!-- Nodo decorativos -->
  <g opacity="0.35" stroke="#22d3ee" stroke-width="1" fill="none">
    <circle cx="920" cy="160" r="5" fill="#22d3ee"/>
    <circle cx="1060" cy="260" r="4" fill="#22d3ee"/>
    <circle cx="880" cy="330" r="4" fill="#a855f7"/>
    <circle cx="1020" cy="420" r="5" fill="#a855f7"/>
    <circle cx="1100" cy="530" r="3" fill="#22d3ee"/>
    <line x1="920" y1="160" x2="1060" y2="260"/>
