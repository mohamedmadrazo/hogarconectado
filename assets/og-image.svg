    <line x1="880" y1="330" x2="1020" y2="420"/>
    <line x1="1020" y1="420" x2="1100" y2="530"/>
  </g>
  <!-- Logo dot -->
  <circle cx="110" cy="115" r="16" fill="#22d3ee"/>
  <text x="140" y="125" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">
    Hogar<tspan fill="#22d3ee">Conectado</tspan>
  </text>
  <!-- Titular -->
  <text x="100" y="300" font-family="'Space Grotesk', Inter, Arial, sans-serif" font-size="78" font-weight="700" fill="#ffffff">Domótica de verdad,</text>
  <text x="100" y="390" font-family="'Space Grotesk', Inter, Arial, sans-serif" font-size="78" font-weight="700" fill="url(#txt)">sin humo.</text>
